<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prova Avançada – Noções de Umbanda</title>

<style>

:root {
  --accent: #064e3b;
  --bg: #f9f9f5;
  --card: #fff;
  --muted: #444;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', Arial, sans-serif;
  margin: 0;
  background: var(--bg);
  color: #222;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

.card {
  background: var(--card);
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.logo {
  text-align: center;
}

.logo img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent);
}

h1 {
  text-align: center;
  color: var(--accent);
  margin-top: 10px;
}

button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
}

button:hover {
  background: #0d7a5c;
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.login-box,
form {
  margin-top: 20px;
}

.question {
  margin-bottom: 20px;
  background: #f0f9f4;
  padding: 10px 15px;
  border-radius: 8px;
}

.options {
  margin-top: 8px;
}

label {
  margin-right: 20px;
  font-size: 16px;
  color: var(--accent);
}

.result {
  background: #e9fff0;
  color: #064e3b;
  padding: 15px;
  border-radius: 8px;
  font-weight: bold;
  display: none;
  margin-top: 20px;
}

.answer-item {
  border-radius: 8px;
  padding: 10px;
  margin-top: 10px;
}

.correct {
  background: #e6ffef;
  color: #036a2d;
}

.wrong {
  background: #ffeaea;
  color: #a10000;
}

@media (max-width: 768px) {

  .container {
    padding: 10px;
  }

  h1 {
    font-size: 20px;
  }

  label {
    display: block;
    margin: 5px 0;
  }

  button {
    font-size: 15px;
  }

}


/* =====================================================
   LEITURA POR VOZ — ÍCONE DISCRETO
   ===================================================== */

.voice-access{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px auto 12px;
}

.voice-btn{
  width:88px;
  height:88px;
  min-width:88px;
  padding:0;

  border:1px solid rgba(255,255,255,.82);
  border-radius:50%;

  background:rgba(255,255,255,.86);
  color:#2aa449;

  font-size:38px;

  cursor:pointer;

  display:grid;
  place-items:center;

  box-shadow:
    0 5px 18px rgba(0,0,0,.10),
    inset 0 1px 2px rgba(255,255,255,.95);

  transition:
    transform .15s ease,
    background .15s ease,
    color .15s ease,
    box-shadow .15s ease;

  -webkit-tap-highlight-color:transparent;
}

.voice-icon{
  width:46px;
  height:46px;
  display:block;
  overflow:visible;
  fill:none;
  stroke:#2aa449;
  stroke-width:5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.voice-icon path:first-child{
  fill:#2aa449;
  stroke:#2aa449;
  stroke-width:2;
}

.voice-btn:hover .voice-icon,
.voice-btn.ativo .voice-icon{
  stroke:#2aa449;
}

.voice-btn:hover .voice-icon path:first-child,
.voice-btn.ativo .voice-icon path:first-child{
  fill:#2aa449;
  stroke:#2aa449;
}


.voice-btn:hover{
  transform:scale(1.04);

  background:rgba(255,255,255,.94);

  box-shadow:
    0 7px 22px rgba(0,0,0,.14),
    inset 0 1px 2px rgba(255,255,255,1);
}

.voice-btn.ativo{
  background:rgba(255,255,255,.94);
  color:#2aa449;
}

.voice-btn.ativo i{
  color:#2aa449;
}

.voice-btn:active{
  transform:scale(.96);
}

.voice-btn:focus-visible{
  outline:2px solid #2aa449;
  outline-offset:4px;
}

.voice-speaking{
  outline:2px solid #2aa449;
  outline-offset:3px;
}

@media(max-width:480px){

  .voice-btn{
    width:82px;
    height:82px;
    min-width:82px;
  }

  .voice-icon{
    width:43px;
    height:43px;
  }

}

</style>
</head>

<body>

<div class="container">


  <!-- =========================
       TELA DE LOGIN
  ========================== -->

  <div class="card" id="loginScreen">

    <div class="logo">

      <img
        src="./logo.jpg"
        alt="Logo do Terreiro"
      >

    </div>


    <h1>Login da Prova</h1>


    <!-- BOTÃO DE LEITURA POR VOZ -->

    <div class="voice-access">

      <button
        class="voice-btn"
        id="voiceBtnLogin"
        type="button"
        aria-label="Ativar leitura por voz"
        aria-pressed="false"
        title="Leitura por voz"
      >

        <svg class="voice-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <path d="M12 25h10l14-12v38L22 39H12z"></path>
  <path d="M43 22c4 4 4 16 0 20"></path>
  <path d="M49 16c8 8 8 24 0 32"></path>
</svg>

      </button>

    </div>


    <div class="login-box">

      <label>Usuário:</label>

      <input
        type="text"
        id="username"
        placeholder="Digite o usuário"
      >


      <label>Senha:</label>

      <input
        type="password"
        id="password"
        placeholder="Digite a senha"
      >


      <button onclick="login()">
        Entrar
      </button>


      <p
        id="error"
        style="color:red;display:none;margin-top:10px;"
      >
        Usuário ou senha incorretos.
      </p>

    </div>

  </div>



  <!-- =========================
       TELA DA PROVA
  ========================== -->

  <div
    class="card"
    id="quizScreen"
    style="display:none;"
  >

    <div class="logo">

      <img
        src="./logo.jpg"
        alt="Logo do Terreiro"
      >

    </div>


    <h1>
      Prova Avançada – Noções de Umbanda
    </h1>


    <!-- BOTÃO DE LEITURA POR VOZ -->

    <div class="voice-access">

      <button
        class="voice-btn"
        id="voiceBtnQuiz"
        type="button"
        aria-label="Ativar leitura por voz"
        aria-pressed="false"
        title="Leitura por voz"
      >

        <svg class="voice-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <path d="M12 25h10l14-12v38L22 39H12z"></path>
  <path d="M43 22c4 4 4 16 0 20"></path>
  <path d="M49 16c8 8 8 24 0 32"></path>
</svg>

      </button>

    </div>


    <form id="quizForm">

      <div id="questions"></div>


      <button
        type="button"
        onclick="verificar()"
      >
        Ver Resultado
      </button>

    </form>


    <div
      class="result"
      id="resultado"
    ></div>


    <div id="respostas"></div>


    <button
      style="margin-top:10px;display:none;"
      id="logoutBtn"
      onclick="logout()"
    >
      Sair
    </button>

  </div>

</div>



<script>


/* =====================================================
   LOGIN
===================================================== */

const user = "paimarcio";
const pass = "2026";



/* =====================================================
   PERGUNTAS
===================================================== */

const perguntas = [

  "A apostila afirma que a Umbanda surgiu no Brasil em 15 de novembro de 1908.",

  "Segundo o material, o anunciador do credo da Umbanda foi Zélio Fernandino de Moraes.",

  "A apostila afirma que a Umbanda abrange aspectos do Candomblé, do Espiritismo e do Catolicismo.",

  "Segundo a apostila, LINHAS são as ramificações das FALANGES.",

  "De acordo com o material, FALANGE corresponde às ramificações das LINHAS.",

  "Segundo a apostila, Oxalá tem origem Iorubá (Nagô).",

  "O dia indicado para Oxalá na apostila é sexta-feira.",

  "A apostila apresenta verde como a cor de Oxalá.",

  "Entre os distintivos apresentados para Oxalá estão o sol, a pomba branca e o céu.",

  "Segundo a apostila, o dia de Iemanjá é sábado.",

  "O Abebé, descrito como um leque em forma circular, é apresentado como distintivo de Iemanjá.",

  "De acordo com o material, Iemanjá possui origem Daomé (Gegê).",

  "A saudação de Iemanjá apresentada na apostila é Odôia.",

  "Segundo a apostila, Nanã Buruquê tem origem Daomé (Gegê).",

  "O material apresenta segunda-feira e sábado como dias de Nanã Buruquê.",

  "Segundo a apostila, os domínios de Ogum são os caminhos e as guerras.",

  "O distintivo de Ogum apresentado no material é o arco e a flecha.",

  "A cor de Ogum indicada na apostila é vermelho e branco.",

  "Oxóssi é apresentado como Orixá caçador, tendo como domínio as matas e as florestas.",

  "Segundo a apostila, a cor de Oxóssi é verde.",

  "A apostila apresenta 'Okê, Okê Arô, Oxóssiê, Okê Odé' entre as saudações de Oxóssi.",

  "Oxum é apresentada no material como Deusa dos rios, lagos, fontes e cachoeiras.",

  "Segundo a apostila, os dias de Oxum são quarta-feira e sábado.",

  "Iansã é apresentada como Deusa dos ventos e das tempestades e como aquela que domina os eguns.",

  "O material indica quarta-feira e sábado como dias de Iansã.",

  "Segundo a apostila, Xangô é associado aos trovões, aos raios e à justiça.",

  "O distintivo de Xangô apresentado no material é o machado de dois lados, chamado oxé.",

  "A apostila afirma que a prioridade de Obaluaê é a cura, embora ele seja apresentado como senhor das doenças.",

  "Segundo o material, Exu é apresentado como mensageiro dos Orixás e possui as horas sagradas 6, 12, 18 e 24.",

  "A pemba é apresentada na apostila como um giz de formato cônico-arredondado, feito de calcário e utilizado ritualisticamente."

];



/* =====================================================
   RESPOSTAS CORRETAS
===================================================== */

const corretas = {

  q1: "Sim",
  q2: "Sim",
  q3: "Sim",
  q4: "Não",
  q5: "Sim",
  q6: "Sim",
  q7: "Sim",
  q8: "Não",
  q9: "Sim",
  q10: "Sim",
  q11: "Sim",
  q12: "Não",
  q13: "Sim",
  q14: "Sim",
  q15: "Sim",
  q16: "Sim",
  q17: "Não",
  q18: "Sim",
  q19: "Sim",
  q20: "Sim",
  q21: "Sim",
  q22: "Sim",
  q23: "Sim",
  q24: "Sim",
  q25: "Sim",
  q26: "Sim",
  q27: "Sim",
  q28: "Sim",
  q29: "Sim",
  q30: "Sim"

};



/* =====================================================
   LOGIN
===================================================== */

function login() {

  const u =
    document
      .getElementById("username")
      .value
      .trim();


  const p =
    document
      .getElementById("password")
      .value
      .trim();


  if (u === user && p === pass) {

    document
      .getElementById("loginScreen")
      .style.display = "none";


    document
      .getElementById("quizScreen")
      .style.display = "block";


    montarPerguntas();


    if(vozAtiva){

      setTimeout(() => {

        falarVoz(
          "Você entrou na Prova Avançada de Noções de Umbanda. Existem 30 perguntas. Toque em uma pergunta para ouvir o texto. Depois escolha sim ou não."
        );

      }, 250);

    }


  } else {

    document
      .getElementById("error")
      .style.display = "block";

  }

}



/* =====================================================
   MONTAR PERGUNTAS
===================================================== */

function montarPerguntas() {

  const qDiv =
    document.getElementById("questions");


  qDiv.innerHTML = "";


  perguntas.forEach((txt, i) => {

    const id = "q" + (i + 1);


    qDiv.innerHTML += `

      <div
        class="question"
        tabindex="0"
        data-voz-pergunta="${i + 1}. ${txt}"
        onclick="lerPergunta(this)"
        onkeydown="if(event.key==='Enter' || event.key===' '){event.preventDefault();lerPergunta(this)}"
      >

        <div>
          ${i + 1}. ${txt}
        </div>


        <div class="options">


          <label onclick="event.stopPropagation()">

            <input
              type="radio"
              name="${id}"
              value="Sim"
            >

            Sim

          </label>


          <label onclick="event.stopPropagation()">

            <input
              type="radio"
              name="${id}"
              value="Não"
            >

            Não

          </label>


        </div>

      </div>

    `;

  });

}



/* =====================================================
   VERIFICAR PROVA
===================================================== */

function verificar() {

  const total =
    Object.keys(corretas).length;


  let acertos = 0;


  let naoResp = [];


  Object.keys(corretas).forEach(k => {

    const r =
      document.querySelector(
        'input[name="' + k + '"]:checked'
      );


    if (!r) {

      naoResp.push(k);

      return;

    }


    if (r.value === corretas[k]) {

      acertos++;

    }

  });


  if (naoResp.length > 0) {

    alert(
      "Responda todas as perguntas antes de enviar!"
    );

    return;

  }


  const resultado =
    document.getElementById("resultado");


  const perc =
    Math.round(
      (acertos / total) * 100
    );


  resultado.style.display = "block";


  resultado.innerHTML = `

    Você acertou

    <strong>${acertos}</strong>

    de

    <strong>${total}</strong>

    perguntas

    (${perc}%).

  `;


  mostrarRespostas();


  if(vozAtiva){

    setTimeout(() => {

      falarVoz(
        `Resultado da prova. Você acertou ${acertos} de ${total} perguntas, totalizando ${perc} por cento.`
      );

    }, 250);

  }


  document
    .getElementById("logoutBtn")
    .style.display = "block";

}



/* =====================================================
   MOSTRAR RESPOSTAS
===================================================== */

function mostrarRespostas() {

  const div =
    document.getElementById("respostas");


  div.innerHTML = "";


  Object.keys(corretas).forEach((k, i) => {

    const r =
      document.querySelector(
        'input[name="' + k + '"]:checked'
      );


    const valor =
      r
        ? r.value
        : "Não respondida";


    const correta =
      corretas[k];


    const cls =
      valor === correta
        ? "correct"
        : "wrong";


    div.innerHTML += `

      <div class="answer-item ${cls}">

        <strong>

          ${i + 1}. ${perguntas[i]}

        </strong>

        <br>

        Sua resposta:

        <b>${valor}</b>

        |

        Correta:

        <b>${correta}</b>

      </div>

    `;

  });

}



/* =====================================================
   SAIR / LOGOUT
===================================================== */

function logout() {

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

  }


  document
    .getElementById("quizScreen")
    .style.display = "none";


  document
    .getElementById("loginScreen")
    .style.display = "block";


  document
    .getElementById("username")
    .value = "";


  document
    .getElementById("password")
    .value = "";


  document
    .getElementById("resultado")
    .style.display = "none";


  document
    .getElementById("respostas")
    .innerHTML = "";


  document
    .getElementById("logoutBtn")
    .style.display = "none";

}



/* =====================================================
   LEITURA POR VOZ
   ===================================================== */

let vozAtiva = false;

let elementoFalando = null;


const voiceBtns = [

  document.getElementById("voiceBtnLogin"),

  document.getElementById("voiceBtnQuiz")

].filter(Boolean);



/* =====================================================
   ENCONTRAR VOZ PORTUGUESA
===================================================== */

function obterVozPtBR(){

  if(!("speechSynthesis" in window)){

    return null;

  }


  const vozes =
    window.speechSynthesis.getVoices();


  return (

    vozes.find(
      v =>
        (v.lang || "").toLowerCase() === "pt-br"
    )

    ||

    vozes.find(
      v =>
        (v.lang || "").toLowerCase().startsWith("pt")
    )

    ||

    null

  );

}



/* =====================================================
   FALAR
===================================================== */

function falarVoz(
  texto,
  aoTerminar = null
){

  if(!("speechSynthesis" in window)){

    if(aoTerminar){

      aoTerminar();

    }

    return;

  }


  window.speechSynthesis.cancel();


  const fala =
    new SpeechSynthesisUtterance(texto);


  fala.lang = "pt-BR";

  fala.rate = 0.88;

  fala.pitch = 1;

  fala.volume = 1;


  const voz =
    obterVozPtBR();


  if(voz){

    fala.voice = voz;

  }


  fala.onend = () => {

    if(aoTerminar){

      aoTerminar();

    }

  };


  fala.onerror = () => {

    if(aoTerminar){

      aoTerminar();

    }

  };


  window.speechSynthesis.speak(fala);

}



/* =====================================================
   ATUALIZAR BOTÕES
===================================================== */

function atualizarBotoesVoz(){

  voiceBtns.forEach(btn => {

    btn.classList.toggle(
      "ativo",
      vozAtiva
    );


    btn.setAttribute(
      "aria-pressed",
      String(vozAtiva)
    );


    btn.setAttribute(
      "aria-label",

      vozAtiva

        ? "Desativar leitura por voz"

        : "Ativar leitura por voz"

    );

  });

}



/* =====================================================
   ATIVAR / DESATIVAR
===================================================== */

function alternarVoz(){

  vozAtiva = !vozAtiva;


  atualizarBotoesVoz();


  if(vozAtiva){

    falarVoz(

      "Leitura por voz ativada. Você pode tocar em uma pergunta para ouvi-la. Ao entrar na prova, as instruções também serão lidas."

    );


  }else{


    if("speechSynthesis" in window){

      window.speechSynthesis.cancel();

    }


    if(elementoFalando){

      elementoFalando
        .classList
        .remove("voice-speaking");


      elementoFalando = null;

    }

  }

}



/* =====================================================
   CLIQUE NO BOTÃO
===================================================== */

voiceBtns.forEach(btn => {

  btn.addEventListener(
    "click",
    alternarVoz
  );

});



/* =====================================================
   LER PERGUNTA
===================================================== */

function lerPergunta(elemento){

  if(!vozAtiva){

    return;

  }


  const texto =
    elemento.getAttribute(
      "data-voz-pergunta"
    );


  if(!texto){

    return;

  }


  if(elementoFalando){

    elementoFalando
      .classList
      .remove("voice-speaking");

  }


  elementoFalando = elemento;


  elementoFalando
    .classList
    .add("voice-speaking");


  falarVoz(

    "Pergunta. " +
    texto +
    ". Escolha sim ou não.",

    () => {

      if(
        elementoFalando === elemento
      ){

        elemento
          .classList
          .remove("voice-speaking");


        elementoFalando = null;

      }

    }

  );

}



/* =====================================================
   LEITURA DE TEXTO
===================================================== */

function lerTextoDaPagina(texto){

  if(vozAtiva){

    falarVoz(texto);

  }

}



/* =====================================================
   CARREGAR VOZES
===================================================== */

if("speechSynthesis" in window){

  window.speechSynthesis.onvoiceschanged = () => {

    obterVozPtBR();

  };

}



/* =====================================================
   ESC
===================================================== */

document.addEventListener(
  "keydown",
  (event) => {

    if(
      event.key === "Escape" &&
      "speechSynthesis" in window
    ){

      window.speechSynthesis.cancel();


      if(elementoFalando){

        elementoFalando
          .classList
          .remove("voice-speaking");


        elementoFalando = null;

      }

    }

  }
);


</script>

</body>
</html>
